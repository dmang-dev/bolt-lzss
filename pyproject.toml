[build-system]
# >=77 for PEP 639 `license` as an SPDX string plus `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bolt-lzss"
version = "0.1.0"
description = "Encoder and decoder for the LZSS variant in Mass Media's BOLT archives"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "dmang-dev" }]
keywords = ["lzss", "compression", "bolt", "n64", "rom-hacking", "mass-media"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Software Development :: Disassemblers",
]

# Standard library only, deliberately. The codec is one file so that it can be
# vendored into a project by copying it, which is how most rom-hacking tools
# actually get used.
dependencies = []

[project.urls]
Homepage = "https://github.com/dmang-dev/lzss-enc"
Issues = "https://github.com/dmang-dev/lzss-enc/issues"

[project.scripts]
bolt-lzss = "bolt_lzss:_main"

[tool.setuptools]
py-modules = ["bolt_lzss"]
