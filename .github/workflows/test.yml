name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.11 is the declared floor in pyproject, and every supported version
        # is tested rather than sampled -- the floor and the ceiling are both
        # claims this package makes on PyPI, and a version number there is
        # immutable once uploaded.
        #
        # The floor is 3.11 because 3.9 reached end of life in October 2025 and
        # 3.10 does so in October 2026. The codec itself is stdlib-only and
        # would run on older interpreters; there is just no reason to promise
        # support for versions that no longer receive security fixes.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .

      # The ROM-dependent tests skip themselves when no cartridge is present,
      # which is always the case here: no game data is in this repository and
      # none is ever downloaded. Roughly 30 of the 37 tests run on CI; the rest
      # need a ROM the maintainer supplies locally.
      - name: Run tests
        run: python test_bolt_lzss.py -v

      - name: CLI round trip
        shell: bash
        run: |
          python bolt_lzss.py encode README.md /tmp/r.bolt
          python bolt_lzss.py decode /tmp/r.bolt /tmp/r.raw
          cmp README.md /tmp/r.raw
          echo "round trip ok"
